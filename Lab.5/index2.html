<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-консультант</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .chat-widget {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .chat-header {
            background: green;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .chat-body {
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f1f1f1;
            font-size: 16px;
            display: flex;
            flex-direction: column;
        }

        .chat-message {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            max-width: 80%;
        }

        .chat-message.user {
            align-self: flex-end;
            background: #dcf8c6;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ccc;
        }

        .chat-input input {
            flex: 1;
            border: none;
            padding: 15px;
            font-size: 16px;
            outline: none;
        }

        .chat-input button {
            background: green;
            color: white;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="chat-widget">
        <div class="chat-header">
            <img src="avatar.png" alt="Аватар">
            Консультант онлайн
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-message"><strong>Консультант:</strong> Вітаємо! Як можемо допомогти?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Введіть повідомлення...">
            <button>➤</button>
        </div>
    </div>
</body>

</html>
