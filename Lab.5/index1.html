<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колодa гральних карт</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
         
        }

        .deck {
            position: relative;
            width: 120px;
            height: 180px;
        }

        .card {
            width: 120px;
            height: 180px;
            background-size: cover;
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            position: absolute;
        }

        .card:nth-child(1) {
            top: 0px;
            left: 0px;
        }

        .card:nth-child(2) {
            top: 15px;
            left: 15px;
        }

        .card:nth-child(3) {
            top: 35px;
            left: 35px;
        }
    </style>
</head>

<body>
    <div class="deck">
        <div class="card" style="background-image: url(https://i.pinimg.com/474x/39/05/95/3905950a2e429591839c119e285a20bf.jpg);"></div>
        <div class="card" style="background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTV37SxPyDqI_4hjdbwaDtuCjWW5g29POatlkOIWQlLmDI_7vRgij1lnwmZwF01ohqofvI&usqp=CAU);"></div>
        <div class="card" style="background-image: url(https://i.pinimg.com/564x/b0/4f/e7/b04fe74344ca98a38162924a6def198b.jpg);"></div>
    </div>
</body>

</html>
